<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>駅一覧 | JR首都圏</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="stations.html">
  <header class="site-header">
    <a class="brand" href="index.html">
      <span class="brand-mark">JR</span>
      <span><strong>JR首都圏</strong><small>架空鉄道会社サイト</small></span>
    </a>
    <nav class="site-nav" aria-label="主要ナビゲーション"><a href="index.html">概要</a><a href="tokyo.html">東京鉄道路線図</a><a href="loop.html">東京環状鉄道路線図</a><a href="stations.html" aria-current="page">駅一覧</a><a href="links.html">サイトリンク</a></nav>
  </header>
  <main>
    <section class="page-hero compact">
      <p class="eyebrow">Station Index</p>
      <h1>駅一覧・停車種別検索</h1>
      <p>駅名やナンバリング、路線名、停車種別で探せます。各駅では乗り入れ路線・駅名・駅ナンバリング・停車種別をまとめて表示します。</p>
    </section>
    <section class="section">
      <div class="search-toolbar">
        <div>
          <label class="search-label" for="stationSearch">キーワード検索</label>
          <input id="stationSearch" class="search-input" type="search" placeholder="例: 東京、JY01、中央、快速" autocomplete="off">
        </div>
        <div class="search-filters">
          <div>
            <label class="search-label" for="groupFilter">路線グループ</label>
            <select id="groupFilter" class="filter-select">
              <option value="">すべて</option>
            </select>
          </div>
          <div>
            <label class="search-label" for="serviceFilter">停車種別</label>
            <select id="serviceFilter" class="filter-select">
              <option value="">すべて</option>
            </select>
          </div>
        </div>
      </div>
      <div id="stationCount" class="result-count"></div>
      <div id="stationEmpty" class="station-empty" hidden>条件に一致する駅がありません。キーワードや絞り込みを変えてみてください。</div>
      <div id="stationResults" class="station-results"></div>
    </section>
</main>
  <footer class="site-footer">
    <p>このサイトは架空の鉄道会社「JR首都圏」を紹介するWebサイトです。</p>
    <p>作成者: zuyasi</p>
  </footer>
  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
